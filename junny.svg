    <rect x="12" y="12" width="856" height="40" fill="url(#bar)"/>
    <rect x="12" y="51" width="856" height="1" fill="#20c997" opacity="0.45"/>
  </g>
  <rect x="12" y="12" width="856" height="596" rx="14" fill="none" stroke="#20c997" stroke-opacity="0.35"/>

  <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="32" r="6" fill="#febc2e"/>
  <circle cx="76" cy="32" r="6" fill="#28c840"/>

  <rect x="104" y="20" width="118" height="24" rx="6" fill="#0d1117"/>
  <text x="163" y="36" text-anchor="middle" class="win" fill="#20c997" font-size="11">junny.tsx</text>

