<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-label="src/junny.tsx">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="12" y="12" width="856" height="596" rx="14"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .win { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, "Malgun Gothic", monospace; }
      .ln { fill: #3d4a55; font-size: 13px; text-anchor: end; }
      .c { font-size: 14px; }
      .kw { fill: #c4b5fd; }
      .ty { fill: #7dd3fc; }
      .fn { fill: #93c5fd; }
      .pr { fill: #fbbf24; }
      .st { fill: #6ee7b7; }
      .nu { fill: #20c997; }
      .op { fill: #94a3b8; }
      .tx { fill: #e2e8f0; }
      .tg { fill: #20c997; }
      .line { opacity: 1; animation: reveal 0.45s ease backwards; }
      .cursor {
        fill: #20c997;
        animation: blink 1s step-end infinite;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="864" height="604" rx="16" fill="#20c997" opacity="0.12" filter="url(#glow)"/>

  <g clip-path="url(#win)">
