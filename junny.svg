      <text class="c" x="130" y="396"><tspan class="pr">focus</tspan><tspan class="op">=</tspan><tspan class="ty">{</tspan><tspan class="st">["firm-banking", "valuation"]</tspan><tspan class="ty">}</tspan></text>
    </g>
