    gutter: line numbers end at x=58
    code x = 76 + indent*18
    indent 0 / 1 / 2 / 3
  -->
  <g class="win" transform="translate(0, 86)">
    <g class="line" style="animation-delay:0.05s">
      <text class="ln" x="58" y="0">1</text>
      <text class="c" x="76" y="0"><tspan class="kw">type</tspan><tspan class="ty"> Role</tspan><tspan class="op"> = </tspan><tspan class="st">"Web Engineer"</tspan><tspan class="op">;</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.12s">
      <text class="ln" x="58" y="22">2</text>
      <text class="c" x="76" y="22"><tspan class="kw">type</tspan><tspan class="ty"> Track</tspan><tspan class="op"> = </tspan><tspan class="st">"firm-banking"</tspan><tspan class="op"> | </tspan><tspan class="st">"valuation"</tspan><tspan class="op">;</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.19s">
      <text class="ln" x="58" y="44">3</text>
    </g>
    <g class="line" style="animation-delay:0.26s">
      <text class="ln" x="58" y="66">4</text>
      <text class="c" x="76" y="66"><tspan class="kw">export default function</tspan><tspan class="fn"> Junny</tspan><tspan class="op">() {</tspan></text>
