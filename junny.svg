      <text class="ln" x="58" y="88">5</text>
      <text class="c" x="94" y="88"><tspan class="kw">const</tspan><tspan class="tx"> me </tspan><tspan class="op">= {</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.40s">
      <text class="ln" x="58" y="110">6</text>
      <text class="c" x="112" y="110"><tspan class="pr">name</tspan><tspan class="op">: </tspan><tspan class="st">"&#52572;&#50696;&#51456;"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.47s">
      <text class="ln" x="58" y="132">7</text>
      <text class="c" x="112" y="132"><tspan class="pr">aka</tspan><tspan class="op">: </tspan><tspan class="st">"Junny"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.54s">
      <text class="ln" x="58" y="154">8</text>
      <text class="c" x="112" y="154"><tspan class="pr">role</tspan><tspan class="op">: </tspan><tspan class="st">"Web Engineer"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.61s">
      <text class="ln" x="58" y="176">9</text>
      <text class="c" x="112" y="176"><tspan class="pr">at</tspan><tspan class="op">: </tspan><tspan class="st">"&#45908;&#51596;"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.68s">
      <text class="ln" x="58" y="198">10</text>
      <text class="c" x="112" y="198"><tspan class="pr">building</tspan><tspan class="op">: </tspan><tspan class="st">"&#54644;&#50808; &#44032;&#49345;&#44228;&#51340; &#54156;&#48197;&#53433; &#51473;&#44228; &#54540;&#47019;&#54268;"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.75s">
      <text class="ln" x="58" y="220">11</text>
      <text class="c" x="112" y="220"><tspan class="pr">studying</tspan><tspan class="op">: </tspan><tspan class="st">"&#51064;&#44277;&#51648;&#45733; &#183; &#44397;&#48124;&#45824; &#49548;&#54532;&#53944;&#50920;&#50612;&#50997;&#54633;&#45824;&#54617;&#50896;"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.82s">
      <text class="ln" x="58" y="242">12</text>
      <text class="c" x="112" y="242"><tspan class="pr">now</tspan><tspan class="op">: </tspan><tspan class="st">"&#44032;&#52824;&#54217;&#44032; &#50696;&#52769;&#47784;&#45944;"</tspan><tspan class="op">,</tspan></text>
    </g>
    <g class="line" style="animation-delay:0.89s">
      <text class="ln" x="58" y="264">13</text>
      <text class="c" x="112" y="264"><tspan class="pr">days</tspan><tspan class="op">: </tspan><tspan class="nu">1448</tspan><tspan class="op">,</tspan></text>
