      <text class="ln" x="58" y="418">20</text>
      <text class="c" x="130" y="418"><tspan class="pr">dream</tspan><tspan class="op">=</tspan><tspan class="st">"Build something useful."</tspan></text>
      <rect class="cursor" x="392" y="407" width="8" height="16" rx="1"/>
