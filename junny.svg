      .tg { fill: #20c997; }
      .line { opacity: 0; animation: reveal 0.45s ease forwards; }
      .cursor {
        fill: #20c997;
        animation: blink 1s step-end infinite;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
